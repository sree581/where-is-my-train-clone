<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Position</title>
    <link rel="stylesheet" href="coach.css">
</head>

<body>

<div class="page">

    <header class="header">
        <button class="back-btn" onclick="history.length > 1 ? history.back() : (location.href = 'index.html')">←</button>

        <div>
            <h1 id="coach-title"></h1>
            <p id="train-title"></p>
        </div>
    </header>

    <section class="selector-section">
        <div class="coach-scroll">
            <div class="coach-list" id="coach-list"></div>
        </div>
    </section>

    <section class="warning">
        <div class="warning-icon">▲</div>

        <div>
            <strong>WARNING!</strong>
            <p>
                Coach position may not be accurate for certain trains.
                Please check it once at the station.
            </p>
        </div>
    </section>

    <main class="coach-wrapper">
        <div id="coach-layout"></div>
    </main>

</div>

<script src="js/config.js"></script>
<script src="coach.js"></script>

</body>
</html>
