<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Position</title>
    <link rel="stylesheet" href="coach.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/nav.css">
</head>

<body>

<div class="page">

    <header class="header">
        <button class="back-btn" onclick="history.length > 1 ? history.back() : (location.href = 'index.html')">←</button>

        <div>
            <h1 id="coach-title"></h1>
            <p id="train-title"></p>
        </div>

        <form class="coach-search" id="coach-search" action="coach.html" method="get">
            <input type="text" name="train" id="coach-search-input"
                   placeholder="Train no. e.g. 16301" inputmode="numeric"
                   pattern="\d{5}" maxlength="5" required
                   aria-label="Train number"
                   title="Enter a 5-digit train number">
            <button type="submit">Show Coaches</button>
        </form>
    </header>

    <section class="selector-section">
        <div class="coach-scroll">
            <div class="coach-list" id="coach-list"></div>
        </div>
    </section>

    <section class="warning">
        <div class="warning-icon">▲</div>

        <div>
            <strong>WARNING!</strong>
            <p>
                Coach position may not be accurate for certain trains.
                Please check it once at the station.
            </p>
        </div>
    </section>

    <main class="coach-wrapper">
        <div id="coach-layout"></div>
    </main>

</div>

<script src="js/config.js"></script>
<script src="js/nav.js"></script>
<script src="coach.js"></script>

</body>
</html>
