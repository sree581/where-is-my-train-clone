<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where Is My Train</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>🚆 Where Is My Train</h1>
        <div class="theme-selector">
            <label for="themeSelect">Theme:</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="light">Light Mode</option>
                <option value="dark">Dark Mode</option>
            </select>
        </div>
    </header>

    <main class="container">
        <!-- Tab Controls -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('spot')">Spot Train</button>
            <button class="tab-btn" onclick="switchTab('between')">Between Stations</button>
        </div>

        <!-- Spot Train Input -->
        <section id="spot-tab" class="tab-content active">
            <div class="search-box">
                <input type="text" id="trainQuery" placeholder="Enter Train No. or Name (e.g., 12626)">
                <button onclick="searchTrain()">Locate</button>
            </div>
        </section>

        <!-- Between Stations Input -->
        <section id="between-tab" class="tab-content">
            <div class="search-box">
                <input type="text" id="fromStation" placeholder="From (e.g., NDLS)">
                <input type="text" id="toStation" placeholder="To (e.g., TVC)">
                <button onclick="searchBetweenStations()">Find Trains</button>
            </div>
        </section>

        <!-- Live Route Container -->
        <div id="trackingContainer" class="tracking-view hidden">
            <!-- Populated via JS -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
